 if(t.closest('#mm a')){$('#mm').classList.remove('open');$('#bg')?.classList.remove('on')}});

if(matchMedia('(hover:hover) and (pointer:fine)').matches){document.body.classList.add('cur');const cd=$('#cd'),cr=$('#cr'),tb=$('#tb');let x=0,y=0,rx=0,ry=0;
 addEventListener('mousemove',ev=>{x=ev.clientX;y=ev.clientY;cd.style.transform=`translate(${x}px,${y}px)`;if(tb.classList.contains('on'))tb.style.transform=`translate(${x+28}px,${y-90}px)`});
 (function f(){rx+=(x-rx)*.16;ry+=(y-ry)*.16;cr.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(f)})();
 document.addEventListener('mouseover',ev=>{const t=ev.target.closest('a,button,[data-cur],input,select,textarea,.row'),c=t?.dataset.cur;cr.classList.toggle('big',!!t);cr.classList.toggle('lb',!!c);cr.dataset.t=c||'';

/* ============ ANIMATIONS (GSAP degrades gracefully if offline) ============ */
function initAnim(q){if(!window.gsap||!window.ScrollTrigger||RM)return;gsap.registerPlugin(ScrollTrigger);ScrollTrigger.getAll().forEach(t=>t.kill());
 gsap.to('#hero .bg',{yPercent:12,ease:'none',scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}});
 $$('.wi img').forEach(i=>gsap.fromTo(i,{yPercent:-5},{yPercent:5,ease:'none',scrollTrigger:{trigger:i.parentNode,scrub:true}}));
 $$('.sl').forEach(l=>gsap.fromTo(l,{opacity:.12,y:30},{opacity:1,y:0,ease:'none',scrollTrigger:{trigger:l,start:'top 88%',end:'top 50%',scrub:true}}));
 if(!q)$$('.rv').forEach(el=>gsap.from(el,{y:44,opacity:0,duration:1.4,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 92%'}}))}
